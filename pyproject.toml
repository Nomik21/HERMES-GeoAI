[project]
name = "hermes"
version = "0.1.0"
description = "hermes using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7"
]

[project.scripts]
hermes = "hermes.main:run"
run_crew = "hermes.main:run"
train = "hermes.main:train"
replay = "hermes.main:replay"
test = "hermes.main:test"
run_with_trigger = "hermes.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
